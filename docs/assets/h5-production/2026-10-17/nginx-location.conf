# Merge into an existing HTTPS server block; this is not a complete virtual host.
# Set the actual domain/TLS configuration in BaoTa. Add that exact origin to Backend CORS.
root /www/wwwroot/hkbusgo-h5/dist;
index index.html;

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}
location ^~ /js/ {
    try_files $uri =404;
}
location ^~ /css/ {
    try_files $uri =404;
}
location ^~ /assets/ {
    try_files $uri =404;
}
location / {
    try_files $uri $uri/ /index.html;
}
# The compiled client requests https://hkbus-api.copypaste.hk/api/ directly.
# Do not assume that a local /api proxy changes the compiled endpoint.
